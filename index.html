<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Varrios Wietloods — Voorraadmanifest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  color-scheme: dark;
  --bg:#07090B;
  --bg-soft:#0B0F0D;
  --surface:rgba(255,255,255,0.025);
  --surface-hi:rgba(255,255,255,0.045);
  --glass:rgba(255,255,255,0.025);
  --glass-hi:rgba(255,255,255,0.045);
  --border:rgba(255,255,255,0.075);
  --border-hi:rgba(255,255,255,0.14);
  --lime:#A6F24D;
  --cyan:#3FDDC4;
  --violet:#9584F0;
  --pink:#EC7FC0;
  --cream:#EEF2EF;
  --muted:#828E89;
  --muted-dim:#5B6560;
  --warn:#F0B24E;
  --danger:#F0645F;
  --grad-a: var(--lime);
  --grad-b: var(--violet);
  --ease: cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;}
body{
  min-height:100vh;position:relative;overflow-x:hidden;
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  background:var(--bg);
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 70% 50% at 50% 0%, black, transparent 70%);
}
h1,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.015em;}
h2,h3{font-family:'Inter',sans-serif;letter-spacing:-0.005em;margin:0;}
.mono{font-family:'Space Mono',monospace;font-variant-numeric:tabular-nums;}

@keyframes fadeUp{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
.wrap > *{animation:fadeUp .4s var(--ease) both;}
.wrap > *:nth-child(2){animation-delay:.025s;}
.wrap > *:nth-child(3){animation-delay:.05s;}
.wrap > *:nth-child(4){animation-delay:.075s;}
.wrap > *:nth-child(5){animation-delay:.1s;}
.wrap > *:nth-child(6){animation-delay:.125s;}
.wrap > *:nth-child(7){animation-delay:.15s;}

/* ---------- layout shell ---------- */
.wrap{max-width:1040px;margin:0 auto;padding:0 24px 64px;position:relative;z-index:1;}
header.top{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:18px 0;margin-bottom:28px;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:40;background:var(--bg);
  margin-left:-24px;margin-right:-24px;padding-left:24px;padding-right:24px;
}
.brand{display:flex;align-items:center;gap:13px;}

.dial{width:32px;height:32px;border-radius:7px;flex-shrink:0;background:var(--lime);
  display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dial.klant{background:var(--violet);}
.dial-inner{display:contents;}
.dial-inner .r{font-family:'Space Mono',monospace;font-weight:700;font-size:10px;color:#08130A;line-height:1;}
.dial-inner .l{display:none;}
.brand-logo{width:34px;height:34px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#000;}

.brand h1{font-size:16.5px;margin:0;line-height:1.1;font-weight:700;color:var(--cream);letter-spacing:-0.01em;}
.brand p{margin:1px 0 0;color:var(--muted);font-size:11px;letter-spacing:0.01em;}

.totals{display:flex;gap:0;flex-wrap:wrap;}
.totals .t{text-align:right;padding:0 20px;border-left:1px solid var(--border);}
.totals .t:first-child{border-left:none;padding-left:0;}
.totals .t .n{font-family:'Space Mono',monospace;font-size:19px;font-weight:700;color:var(--cream);letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
.totals .t .n.tegoed{color:var(--lime);}
.totals .t .l{font-size:9.5px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-top:3px;font-weight:600;}

/* ---------- nav tabs ---------- */
.navtabs{display:inline-flex;gap:2px;margin-bottom:24px;padding:3px;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;}
.navtab{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:transparent;border:none;color:var(--muted);
  font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;border-radius:5px;
  cursor:pointer;transition:color .15s ease, background .15s ease;}
.navtab svg{flex-shrink:0;}
.navtab:hover{color:var(--cream);}
.navtab.active{background:var(--surface-hi);color:var(--cream);}
.navtab.active svg{color:var(--lime);}

/* ---------- login / profiles ---------- */
.login-shell{max-width:640px;margin:44px auto 0;text-align:center;}
.login-shell h2{font-size:17px;margin-bottom:6px;font-weight:600;letter-spacing:-0.01em;}
.login-shell .sub{color:var(--muted);font-size:12.5px;margin-bottom:32px;line-height:1.6;}
.avatar-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.avatar-tile{
  width:112px;padding:18px 10px 15px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  transition:border-color .15s, background .15s;
}
.avatar-tile:hover{border-color:var(--border-hi);background:var(--surface-hi);}
.avatar-circle{width:36px;height:36px;border-radius:7px;background:transparent;
  display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;
  font-weight:700;font-size:13px;color:#08130A;}
.avatar-photo{border-radius:7px;background-size:cover;background-position:center;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:700;color:#08130A;}
.who-avatar-btn{background:none;border:none;padding:0;margin-right:9px;cursor:pointer;line-height:0;border-radius:6px;
  transition:box-shadow .15s;}
.who-avatar-btn:hover{box-shadow:0 0 0 2px var(--border-hi);}
.avatar-tile .nm{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;text-transform:capitalize;color:var(--cream);}
.avatar-tile .st{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--muted);letter-spacing:0.02em;}
.avatar-tile .st .dot{width:5px;height:5px;border-radius:50%;background:var(--lime);}
.avatar-tile.unclaimed .st .dot{background:var(--warn);}
.avatar-tile.add{border-style:dashed;border-color:var(--border-hi);background:transparent;}
.avatar-tile.add .avatar-circle{background:transparent;border:1.5px dashed var(--muted-dim);color:var(--muted);}
.avatar-tile.add .nm{color:var(--muted);}

.modal-bg{position:fixed;inset:0;background:rgba(4,5,6,0.82);
  display:flex;justify-content:center;z-index:50;padding:16px;
  padding-top:max(16px, env(safe-area-inset-top));
  padding-bottom:max(16px, env(safe-area-inset-bottom));
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
.modal{background:#0C0F0D;border:1px solid var(--border-hi);border-radius:10px;padding:24px;
  width:100%;max-width:330px;margin:auto;flex-shrink:0;box-shadow:0 20px 50px rgba(0,0,0,0.5);}
.modal h3{margin:0 0 4px;font-size:16.5px;font-weight:600;letter-spacing:-0.01em;}
.modal p.hint{color:var(--muted);font-size:12px;margin:0 0 16px;line-height:1.55;}
.modal label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;margin-top:14px;font-weight:600;}
.modal input{width:100%;background:rgba(255,255,255,0.035);border:1px solid var(--border);border-radius:7px;color:var(--cream);
  padding:12px;font-family:'Space Mono',monospace;font-size:16px;letter-spacing:0.03em;transition:border-color .15s, box-shadow .15s;}
.modal input:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(166,242,77,0.1);}
.modal .row-btns{display:flex;gap:8px;margin-top:22px;}
.err{color:var(--danger);font-size:11.5px;margin-top:8px;min-height:14px;}

button{cursor:pointer;font-family:'Inter',sans-serif;touch-action:manipulation;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--grad-a);border:1px solid transparent;color:#08130A;font-weight:600;padding:10px 16px;font-size:13px;
  border-radius:7px;letter-spacing:0.005em;transition:filter .12s, background .12s, border-color .12s;min-height:38px;}
.btn svg{flex-shrink:0;}
.btn:hover{filter:brightness(1.08);}
.btn:active{filter:brightness(0.96);}
.btn.klant{background:var(--grad-b);}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--cream);font-weight:600;}
.btn.secondary:hover{border-color:var(--border-hi);filter:none;background:var(--surface);}
.btn.block{width:100%;}
.btn:disabled{opacity:0.35;cursor:not-allowed;filter:none;}
.btn.small{padding:6px 11px;font-size:11px;min-height:28px;border-radius:6px;}
.btn.boss{background:var(--grad-b);}
.btn.danger{background:transparent;border:1px solid var(--border);color:var(--danger);font-weight:600;}
.btn.danger:hover{background:rgba(240,100,95,0.08);border-color:rgba(240,100,95,0.4);filter:none;}

/* ---------- dashboard ---------- */
.who{display:flex;align-items:center;justify-content:space-between;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;
  padding:13px 16px;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.who .name{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;text-transform:capitalize;display:flex;align-items:center;}
.who .name span{color:var(--muted);font-size:11px;font-weight:400;font-family:'Inter',sans-serif;text-transform:none;
  display:inline-flex;align-items:center;}
.who .name span::before{content:'•';margin:0 8px;color:var(--muted-dim);font-size:8px;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
@media(max-width:680px){.grid2{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;
  transition:border-color .15s;
  max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.card:hover{border-color:var(--border-hi);}
.card h2{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:0 0 4px;font-weight:600;letter-spacing:-0.005em;}
.card h2 svg{color:var(--lime);flex-shrink:0;}
.card p.hint{color:var(--muted);font-size:12px;margin:0 0 15px;line-height:1.55;}
.card label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;font-weight:600;}
.card input[type=number],.card input[type=text],.card input[type=tel]{width:100%;background:rgba(255,255,255,0.035);
  border:1px solid var(--border);border-radius:7px;color:var(--cream);
  padding:10px 12px;font-family:'Space Mono',monospace;font-size:16px;transition:border-color .15s, box-shadow .15s;}
.card input:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(166,242,77,0.1);}
select.select-field{width:100%;background:rgba(255,255,255,0.035);border:1px solid var(--border);border-radius:7px;color:var(--cream);
  padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;}
select.select-field:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(149,132,240,0.12);}
select.select-field option{background:#0C0F0D;color:var(--cream);}
.preview{margin-top:10px;font-size:11.5px;color:var(--muted);min-height:16px;}
.preview b{color:var(--lime);font-family:'Space Mono',monospace;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;
  font-weight:600;padding:0 10px 10px 0;border-bottom:1px solid var(--border);}
td{padding:10px 10px 10px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;}
td.num,th.num{text-align:right;font-family:'Space Mono',monospace;font-variant-numeric:tabular-nums;}
tr.me td{background:rgba(166,242,77,0.04);}
tr.clickable{cursor:pointer;touch-action:manipulation;transition:background .1s;}
tr.clickable:hover td{background:rgba(255,255,255,0.025);}
.tegoed{color:var(--lime);font-weight:700;}
.drag-handle{cursor:grab;touch-action:none;color:var(--muted-dim);display:inline-flex;align-items:center;padding:4px;margin-right:2px;}
.drag-handle:hover{color:var(--muted);}
tr.dragging{opacity:0.45;background:var(--surface-hi);}
.pill{display:inline-block;background:rgba(149,132,240,0.1);border:1px solid rgba(149,132,240,0.28);color:var(--violet);
  font-size:9.5px;padding:2.5px 8px;border-radius:20px;letter-spacing:0.02em;font-weight:600;}

.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 11px;flex-wrap:wrap;gap:8px;}
.section-title h2{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:0;font-weight:600;letter-spacing:-0.005em;}
.section-title h2 svg{color:var(--muted);flex-shrink:0;}
.section-title span{font-size:10.5px;color:var(--muted-dim);font-family:'Space Mono',monospace;}

.log{display:flex;flex-direction:column;gap:0;}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;
  padding:11px 4px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12.5px;}
.entry:last-child{border-bottom:none;}
.entry .ts{color:var(--muted-dim);font-family:'Space Mono',monospace;font-size:10.5px;white-space:nowrap;}
.entry .desc b{color:var(--cream);font-weight:600;}
.entry .desc .sub{color:var(--muted);font-size:11px;display:block;margin-top:2px;}
.entry .delta{font-family:'Space Mono',monospace;font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;}
.entry.inleg .delta,.entry.levering .delta{color:var(--lime);}
.entry.ophalen .delta{color:var(--warn);}
.entry.correctie .delta{color:var(--muted);}
.empty{color:var(--muted-dim);font-size:12.5px;padding:26px 0;text-align:center;}

.back-link{color:var(--muted);font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  margin-bottom:16px;cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif;padding:0;font-weight:500;}
.back-link:hover{color:var(--cream);}

.klant-search{width:100%;background:rgba(255,255,255,0.035);border:1px solid var(--border);border-radius:7px;color:var(--cream);
  padding:10px 13px;font-size:16px;margin-bottom:0;}
.klant-search:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(149,132,240,0.12);}

.klant-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
.klant-head h1{font-size:21px;margin:0 0 8px;font-weight:700;letter-spacing:-0.015em;}
.klant-head .meta{color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.klant-head .meta a{color:var(--cream);text-decoration:none;}

.linklike{background:none;border:none;color:var(--muted);font-size:11.5px;text-decoration:underline;padding:0;}
.linklike:hover{color:var(--cream);}
footer.note{margin-top:36px;color:var(--muted-dim);font-size:11px;line-height:1.65;border-top:1px solid var(--border);padding-top:16px;}

.syncdot{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);letter-spacing:0.02em;}
.syncdot .d{width:5px;height:5px;border-radius:50%;background:var(--cyan);}
.syncdot.off .d{background:var(--danger);}

/* ---------- loading bar ---------- */
#loading-bar{position:fixed;top:0;left:0;height:2px;width:0;z-index:100;
  background:var(--grad-a);opacity:0;}
#loading-bar.active{opacity:1;width:70%;transition:width 3.5s cubic-bezier(.1,.6,.2,1);}
#loading-bar.done{width:100%;transition:width .2s ease;}

/* ---------- toasts ---------- */
#toast-root{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;
  max-width:min(300px, calc(100vw - 32px));}
.toast{background:#0C0F0D;border:1px solid var(--border-hi);border-radius:8px;padding:12px 14px;
  box-shadow:0 12px 28px rgba(0,0,0,0.4);font-size:12.5px;color:var(--cream);line-height:1.4;
  animation:toastIn .2s var(--ease) both;transition:opacity .3s;}
.toast.error{border-color:rgba(240,100,95,0.35);}
@keyframes toastIn{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}

/* ---------- person color dot ---------- */
.p-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;flex-shrink:0;vertical-align:middle;}

/* ---------- progress bar ---------- */
.progress-wrap{margin-bottom:20px;}
.progress-bar{height:5px;border-radius:999px;background:rgba(255,255,255,0.05);overflow:hidden;}
.progress-fill{height:100%;background:var(--grad-a);border-radius:999px;transition:width .6s var(--ease);}
.progress-label{margin-top:8px;font-size:11px;color:var(--muted);}
.progress-label b{color:var(--cream);font-family:'Space Mono',monospace;font-weight:700;}

/* ---------- sidebar (desktop: vaste app shell / mobiel: uitschuifbaar menu) ---------- */
#sidebar{
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;width:240px;max-width:78vw;
  padding:20px 14px;padding-top:max(20px, env(safe-area-inset-top));
  border-right:1px solid var(--border);background:var(--bg);
  z-index:70;overflow-y:auto;
  transform:translateX(-100%);
  transition:transform .22s var(--ease);
}
#sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,0.5);}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(4,5,6,0.6);z-index:65;}
#sidebar-overlay.open{display:block;}
.menu-toggle-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
  border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--cream);
  cursor:pointer;flex-shrink:0;padding:0;}
.menu-toggle-btn:hover{background:var(--surface-hi);}
@media(min-width:880px){
  #sidebar{width:216px;transform:none;transition:none;box-shadow:none;}
  #sidebar-overlay,.menu-toggle-btn{display:none !important;}
  header.top,.navtabs{display:none;}
  .wrap{margin:0 0 0 216px;max-width:900px;padding:36px 32px 64px;}
  .who-avatar-btn,.who-logout{display:none;}
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;margin-bottom:8px;border-bottom:1px solid var(--border);}
.sidebar-brand h1{font-size:14.5px;margin:0;color:var(--cream);font-weight:700;letter-spacing:-0.01em;}
.sidebar-brand p{margin:1px 0 0;font-size:10px;color:var(--muted);}
.sidebar-nav{display:flex;flex-direction:column;gap:1px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--muted);
  text-decoration:none;font-size:12.5px;font-weight:600;cursor:pointer;transition:background .12s,color .12s;}
.sidebar-link svg{flex-shrink:0;}
.sidebar-link:hover{background:var(--surface);color:var(--cream);}
.sidebar-link.active{background:var(--surface-hi);color:var(--cream);}
.sidebar-link.active svg{color:var(--lime);}
.sidebar-link .count{margin-left:auto;font-size:10px;color:var(--muted-dim);font-family:'Space Mono',monospace;}
.sidebar-spacer{flex:1;}
.sidebar-footer{border-top:1px solid var(--border);padding-top:12px;margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.sidebar-footer .syncdot{padding:0 7px;margin-bottom:2px;}
.sidebar-user{display:flex;align-items:center;gap:8px;padding:4px 2px 4px 5px;border-radius:6px;}
.sidebar-user span{font-size:12px;font-weight:600;color:var(--cream);text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.sidebar-gear{background:none;border:none;padding:6px;margin:0;border-radius:6px;color:var(--muted);cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;}
.sidebar-gear:hover{background:var(--surface);color:var(--cream);}
</style>
</head>
<body>
<div id="loading-bar"></div>
<div id="sidebar-overlay"></div>
<aside id="sidebar"></aside>
<div class="wrap" id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<!-- Supabase JS client (UMD build, geen npm/build-stap nodig) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================

function fmtTs(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('nl-BE',{day:'2-digit',month:'2-digit'}) + ' · ' +
         d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'});
}
function fmtClock(d){ return d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(d){ return d.toLocaleDateString('nl-BE',{day:'2-digit',month:'2-digit'}); }
function fmtDuration(ms){
  const totalMin = Math.max(0, Math.round(ms / 60000));
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  const parts = [];
  if(days > 0) parts.push(`${days}d`);
  if(days > 0 || hours > 0) parts.push(`${hours}u`);
  parts.push(`${mins}min`);
  return parts.join(' ');
}

// ---------- verwerkingswachtrij (FIFO, batches van 3 zakjes/3 min) ----------
// Puur berekend uit bestaande 'inleg'-registraties, schrijft niets weg.
// Server-restarts: tijdens deze dagelijkse vensters wordt er niet verwerkt.
const RESTART_WINDOWS = [
  { h: 7, m: 58, endH: 8, endM: 3 },
  { h: 11, m: 58, endH: 12, endM: 3 },
  { h: 17, m: 58, endH: 18, endM: 3 }
];
// vindt het vroegste restart-venster dat overlapt met het interval start t/m end
function findEarliestBlackoutOverlap(start, end){
  let best = null;
  for(let dayOffset = -1; dayOffset <= 2; dayOffset++){
    for(const w of RESTART_WINDOWS){
      const ws = new Date(start); ws.setDate(ws.getDate() + dayOffset); ws.setHours(w.h, w.m, 0, 0);
      const we = new Date(start); we.setDate(we.getDate() + dayOffset); we.setHours(w.endH, w.endM, 0, 0);
      if(ws < end && we > start){
        if(!best || ws < best.start) best = { start: ws, end: we };
      }
    }
  }
  return best;
}
// een batch is ondeelbaar: raakt hij een restart-venster (ook maar gedeeltelijk),
// dan telt die voortgang niet mee en herbegint de VOLLEDIGE batch na de restart
function scheduleBatch(startDate, batchMinutes){
  let start = new Date(startDate);
  while(true){
    const end = new Date(start.getTime() + batchMinutes * 60000);
    const overlap = findEarliestBlackoutOverlap(start, end);
    if(!overlap) return { start, end };
    start = new Date(overlap.end);
  }
}

// offsetMinutes: verschuift de volledige gesimuleerde klok (zowel de "eligible"-
// starttijd van elke batch als de restart-controle) — zo blijft alles in de
// juiste relatieve volgorde/afstand staan t.o.v. elkaar, geen losse sprongen.
function computeQueueTimeline(log, batchSize, batchMinutes, offsetMinutes){
  batchSize = batchSize || LOODS_CONFIG_DEFAULT.batch_size;
  batchMinutes = batchMinutes || LOODS_CONFIG_DEFAULT.batch_minutes;
  const offsetMs = (offsetMinutes || 0) * 60000;
  const deposits = log.filter(e => e.type === 'inleg' && e.zakjes_delta > 0)
    .slice().sort((a,b) => new Date(a.ts) - new Date(b.ts));

  // ontvouw elke inleg in losse zakjes (FIFO), en groepeer die per batchSize
  const units = [];
  deposits.forEach((e, di) => {
    for(let i = 0; i < e.zakjes_delta; i++) units.push({ depositIndex: di, depositTs: new Date(e.ts) });
  });
  const batches = [];
  for(let i = 0; i < units.length; i += batchSize) batches.push(units.slice(i, i + batchSize));

  let freeAt = null;
  const perDeposit = new Map();
  const batchResults = []; // per BATCH (niet per inleg) — nodig om verwerkte zakjes correct te tellen
  batches.forEach(batch => {
    const eligible = new Date(Math.max(...batch.map(u => u.depositTs.getTime())) + offsetMs);
    const from = (freeAt && freeAt > eligible) ? freeAt : eligible;
    const { start, end } = scheduleBatch(from, batchMinutes);
    freeAt = end;
    const byUser = {}; // hoeveel zakjes van deze batch per persoon — nodig voor per-profiel "momenteel"-cijfers
    // sleutel op user_id (stabiel, ook na een naamswijziging), user_name is enkel fallback
    // voor oude logregels van een intussen verwijderd profiel (user_id dan null)
    batch.forEach(u => {
      const dep = deposits[u.depositIndex];
      const ukey = dep.user_id || dep.user_name;
      byUser[ukey] = (byUser[ukey] || 0) + 1;
      if(!perDeposit.has(u.depositIndex)){
        perDeposit.set(u.depositIndex, { userName: dep.user_name, amount: dep.amount, zakjes: 0, start, end });
      }
      const d = perDeposit.get(u.depositIndex);
      d.zakjes += 1;
      if(start < d.start) d.start = start;
      if(end > d.end) d.end = end;
    });
    batchResults.push({ start, end, zakjes: batch.length, byUser });
  });
  // deposits = voor weergave (1 regel per inleg); batches = voor de correcte
  // "hoeveel is er al verwerkt"-telling (per batch, niet pas als de HELE inleg
  // — die over meerdere batches kan lopen — helemaal af is)
  return { deposits: [...perDeposit.values()], batches: batchResults };
}

// bouwt een "getrimde" versie van het logboek voor de wachtrij-simulatie:
// het bevroren legacy-deel van iedereen (al verwerkt vóór de laatste
// ratio-omschakeling, cutoverAtIso) wordt eruit gehaald — dat ligt al vast
// in user.legacy_zakjes en hoeft niet nog eens gesimuleerd te worden. Van
// elke inleg die nog (gedeeltelijk) na de cutover valt, blijft enkel het
// overschot over, herberekend in zakjes-eenheden aan de HUIDIGE ratio i.p.v.
// de historische zakjes_delta (die was berekend aan de ratio van tóen).
// Zonder cutoverAtIso (nog geen migratie gebeurd) wordt het log ongewijzigd
// doorgegeven.
function buildPostCutoverLog(fullLog, users, cutoverAtIso){
  if(!cutoverAtIso) return fullLog;
  const cutoverAt = new Date(cutoverAtIso);
  const legacyLeft = new Map(users.map(u => [u.id, (u.legacy_zakjes || 0) * LEGACY_RATIO_IN]));
  const deposits = fullLog.filter(e => e.type === 'inleg' && e.zakjes_delta > 0)
    .slice().sort((a,b) => new Date(a.ts) - new Date(b.ts));
  const trimmed = [];
  deposits.forEach(d => {
    const left = legacyLeft.has(d.user_id) ? legacyLeft.get(d.user_id) : 0;
    const consumed = Math.min(d.amount, left);
    if(legacyLeft.has(d.user_id)) legacyLeft.set(d.user_id, left - consumed);
    const remainingAmount = d.amount - consumed;
    if(remainingAmount <= 0) return; // volledig legacy -> weglaten uit de simulatie
    const remainingZakjes = Math.floor(remainingAmount / RATIO_IN);
    if(remainingZakjes <= 0) return;
    const ts = new Date(d.ts) < cutoverAt ? cutoverAt.toISOString() : d.ts;
    trimmed.push({ ...d, amount: remainingAmount, zakjes_delta: remainingZakjes, ts });
  });
  return trimmed;
}

let lastQueueResult = { deposits: [], batches: [] };
let lastLoodsBaseline = { ...LOODS_CONFIG_DEFAULT };
let queueTickInterval = null;
let queueFilterMode = 'active'; // 'active' = bezig/nog beginnen (standaard) | 'done' = afgerond

// tijdens onderhoudsmodus (lastLoodsBaseline.paused) staat de gesimuleerde
// wachtrij-klok stil op het exacte moment van pauzeren — overal waar de
// wachtrij "nu" nodig heeft, gebruik je deze i.p.v. rechtstreeks new Date()
function nowForQueue(){
  if(lastLoodsBaseline && lastLoodsBaseline.paused && lastLoodsBaseline.paused_at){
    return new Date(lastLoodsBaseline.paused_at);
  }
  return new Date();
}

// LET OP — sinds de invoering van legacy_zakjes bevat "result" hier enkel nog
// de NA-CUTOVER wachtrij (zie buildPostCutoverLog): het legacy-deel (al
// verwerkt vóór de ratio-omschakeling) zit er bewust NIET in, dat ligt al
// vast in user.legacy_zakjes. "verwerkt" in de functies hieronder betekent
// dus telkens "hoeveel van het NIEUWE (na-cutover) deel is al verwerkt" —
// niet het totaal. Waar het totaal nodig is, wordt legacy_zakjes er expliciet
// bijgeteld.

// hoeveel zakjes er van het NA-CUTOVER deel van de wachtrij tot nu toe al
// verwerkt zijn (site-breed) — telt op BATCH-niveau (niet per inleg)
function verwerkteZakjesInQueue(result){
  const now = nowForQueue();
  return result.batches.filter(b => b.end <= now).reduce((s,b) => s + b.zakjes, 0);
}
// zelfde telling, maar per persoon (user_id -> aantal na-cutover al verwerkte zakjes)
function verwerkteZakjesPerPersoon(result){
  const now = nowForQueue();
  const map = new Map();
  result.batches.filter(b => b.end <= now).forEach(b => {
    Object.entries(b.byUser).forEach(([name, count]) => {
      map.set(name, (map.get(name) || 0) + count);
    });
  });
  return map;
}
// totaal aantal zakjes dat voor iemand OOIT verwerkt is: het bevroren
// legacy-deel (oude ratio) + wat er sinds de omschakeling zelf al verwerkt is
function totaalVerwerktVoorPersoon(user, verwerktPerPersoon){
  return (user.legacy_zakjes || 0) + (verwerktPerPersoon.get(user.id) || 0);
}
// planten die voor één persoon nog niet door de wachtrij verwerkt zijn:
// totaal ingelegd min wat er al "verbruikt" is — het legacy-deel aan de oude
// ratio, het na-cutover-deel aan de huidige (nieuwe) ratio
function momenteelInlegVoorPersoon(user, verwerktPerPersoon){
  const verwerkt = verwerktPerPersoon.get(user.id) || 0;
  const verwerktPlanten = (user.legacy_zakjes || 0) * LEGACY_RATIO_IN + verwerkt * RATIO_IN;
  return Math.max(0, user.total_ingelegd - verwerktPlanten);
}
// planten die volgens de wachtrij nu nog fysiek in de loods liggen (nog niet
// door een batch verwerkt) — site-breed, som van alle personen
function plantenNogInLoods(result, users){
  const verwerktPerPersoon = verwerkteZakjesPerPersoon(result);
  return users.reduce((s,u) => s + momenteelInlegVoorPersoon(u, verwerktPerPersoon), 0);
}
// zakjes die al verwerkt zijn (legacy + na-cutover) maar nog NIET opgehaald —
// dit is dus wat er nu écht klaarligt om op te halen. Anders dan "nog tegoed"
// (instant toegekend bij inleg, los van verwerkingstijd): dit houdt wel
// rekening met de wachtrij-simulatie, en daalt zodra iemand ophaalt.
function zakjesKlaarInLoods(result, users){
  const verwerktPerPersoon = verwerkteZakjesPerPersoon(result);
  return users.reduce((s,u) => s + Math.max(0, totaalVerwerktVoorPersoon(u, verwerktPerPersoon) - u.opgehaald), 0);
}
function updateLoodsStatTile(){
  const el = document.getElementById('stat-planten-loods');
  if(el) el.textContent = fmtNum(plantenNogInLoods(lastQueueResult, cache.users));
  const el2 = document.getElementById('stat-zakjes-in-loods');
  if(el2) el2.textContent = fmtNum(zakjesKlaarInLoods(lastQueueResult, cache.users));
  // per-profiel "momenteel inleg" / "momenteel tegoed" kolommen, indien de tabel op het scherm staat
  if(document.querySelector('[data-momenteel-inleg]')){
    const verwerktPerPersoon = verwerkteZakjesPerPersoon(lastQueueResult);
    cache.users.forEach(u => {
      const c1 = document.querySelector(`[data-momenteel-inleg="${u.id}"]`);
      if(c1){
        const mi = momenteelInlegVoorPersoon(u, verwerktPerPersoon);
        c1.textContent = fmtNum(mi);
        const kleur = momenteelInlegKleur(mi);
        c1.style.color = kleur || '';
        c1.style.fontWeight = kleur ? '700' : '';
      }
      const c2 = document.querySelector(`[data-momenteel-tegoed="${u.id}"]`);
      if(c2) c2.textContent = fmtNum(Math.max(0, totaalVerwerktVoorPersoon(u, verwerktPerPersoon) - u.opgehaald));
    });
  }
}

function queueWidgetHtml(result, baseline){
  const deposits = result.deposits;
  const now = nowForQueue();
  const active = deposits.filter(t => t.end > now).sort((a,b) => a.start - b.start);
  const done = deposits.filter(t => t.end <= now).sort((a,b) => b.end - a.end).slice(0, 100);
  const filter = queueFilterMode;
  const list = filter === 'done' ? done : active;
  const hint = `Eerlijk op volgorde van inleg (FIFO) — batches van ${baseline.batch_size} zakjes per ${baseline.batch_minutes} min. Een batch die een server-restart raakt (7u58-8u03, 11u58-12u03, 17u58-18u03) herbegint volledig na de restart.`;
  const pauseBanner = baseline.paused ? `<div class="hint" style="margin-bottom:14px;padding:10px 12px;border-radius:8px;background:rgba(255,180,60,0.12);border:1px solid rgba(255,180,60,0.35);color:#ffb43c;">⏸ De wachtrij staat gepauzeerd sinds ${fmtClock(new Date(baseline.paused_at))} (${fmtDate(new Date(baseline.paused_at))}) voor onderhoud — de tijden hieronder bewegen niet mee.</div>` : '';

  const pendingEnds = result.batches.map(b => b.end).filter(e => e > now);
  const etaLine = pendingEnds.length ? (() => {
    const finishAt = new Date(Math.max(...pendingEnds.map(d => d.getTime())));
    return `<p class="hint" style="margin-bottom:14px;">Volledige wachtrij verwerkt over <b class="mono" style="color:var(--lime)">${fmtDuration(finishAt - now)}</b> — klaar rond <b>${fmtDate(finishAt)} ${fmtClock(finishAt)}</b>.</p>`;
  })() : '';

  const filterRow = `
    <select id="queue-filter" class="select-field" style="margin-bottom:14px;">
      <option value="active" ${filter==='active'?'selected':''}>Nog bezig / nog beginnen (${active.length})</option>
      <option value="done" ${filter==='done'?'selected':''}>Afgerond (${done.length})</option>
    </select>`;

  if(list.length === 0){
    return `<div class="card" id="queue-widget" style="margin-bottom:20px;">
      <h2>${ICONS.clock}Verwerkingswachtrij</h2>
      ${pauseBanner}
      ${etaLine}
      <p class="hint">${hint}</p>
      ${filterRow}
      <div class="empty">${filter==='done' ? 'Nog niets afgerond.' : 'Wachtrij is momenteel leeg.'}</div>
    </div>`;
  }

  const rows = list.map((t, i) => {
    const processing = filter === 'active' && t.start <= now && now < t.end;
    let statusText, deltaText;
    if(filter === 'done'){
      statusText = 'voltooid';
      deltaText = '✓';
    } else {
      const remainingMin = Math.max(0, Math.ceil((t.end - now) / 60000));
      statusText = processing
        ? `wordt verwerkt · nog ${remainingMin} min`
        : `wacht op zijn beurt · start om ${fmtClock(t.start)}`;
      deltaText = processing ? '⏳' : '#' + (i+1);
    }
    return `<div class="entry ${(processing || filter==='done') ? 'inleg' : ''}">
      <div class="ts">${fmtDate(t.start)} | ${fmtClock(t.start)} - ${fmtClock(t.end)}</div>
      <div class="desc">${personDot(t.userName)}<b>${escapeHtml(t.userName)}</b> — ${t.zakjes} zakje${t.zakjes===1?'':'s'}
        <span class="sub">${statusText}</span>
      </div>
      <div class="delta">${deltaText}</div>
    </div>`;
  }).join('');

  return `<div class="card" id="queue-widget" style="margin-bottom:20px;">
    <h2>${ICONS.clock}Verwerkingswachtrij</h2>
    ${pauseBanner}
    ${etaLine}
    <p class="hint">${hint}</p>
    ${filterRow}
    <div class="log">${rows}</div>
  </div>`;
}
function attachQueueWidgetHandlers(){
  const sel = document.getElementById('queue-filter');
  if(sel) sel.addEventListener('change', () => {
    queueFilterMode = sel.value;
    const el = document.getElementById('queue-widget');
    if(el){ el.outerHTML = queueWidgetHtml(lastQueueResult, lastLoodsBaseline); attachQueueWidgetHandlers(); }
  });
}
function startQueueTicker(){
  if(queueTickInterval) clearInterval(queueTickInterval);
  queueTickInterval = setInterval(() => {
    const el = document.getElementById('queue-widget');
    if(!el){ clearInterval(queueTickInterval); return; }
    el.outerHTML = queueWidgetHtml(lastQueueResult, lastLoodsBaseline);
    attachQueueWidgetHandlers();
    updateLoodsStatTile();
  }, 20000);
}

// legacyZakjes ligt vast aan LEGACY_RATIO_IN (oude ratio); alles daarbovenop
// (rest) telt aan de huidige RATIO_IN (nieuwe ratio)
function zakjesForTotal(legacyZakjes, totalIngelegd){
  const rest = Math.max(0, totalIngelegd - legacyZakjes * LEGACY_RATIO_IN);
  return legacyZakjes + Math.floor(rest / RATIO_IN) * RATIO_OUT;
}
function zakjesVoor(user){ return zakjesForTotal(user.legacy_zakjes || 0, user.total_ingelegd); }
function zakjesVoorKlant(totalGeleverd){ return Math.floor(totalGeleverd / KLANT_RATIO_IN) * KLANT_RATIO_OUT; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function hashPin(pin){
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ---------- rijen verslepen om volgorde aan te passen (muis + touch) ----------
let rowDragState = null;
function attachRowDrag(tbody, onReorder){
  if(!tbody) return;
  tbody.querySelectorAll('[data-drag-handle]').forEach(handle => {
    handle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const row = handle.closest('tr');
      if(!row) return;
      rowDragState = { tbody, row, onReorder };
      row.classList.add('dragging');
      document.addEventListener('pointermove', onRowDragMove);
      document.addEventListener('pointerup', onRowDragEnd);
    });
  });
}
function onRowDragMove(e){
  if(!rowDragState) return;
  const { tbody, row } = rowDragState;
  const rows = [...tbody.querySelectorAll('tr')];
  const afterRow = rows.find(r => {
    if(r === row) return false;
    const rect = r.getBoundingClientRect();
    return e.clientY < rect.top + rect.height / 2;
  });
  if(afterRow) tbody.insertBefore(row, afterRow);
  else tbody.appendChild(row);
}
async function onRowDragEnd(){
  document.removeEventListener('pointermove', onRowDragMove);
  document.removeEventListener('pointerup', onRowDragEnd);
  if(!rowDragState) return;
  const { tbody, row, onReorder } = rowDragState;
  row.classList.remove('dragging');
  rowDragState = null;
  const ids = [...tbody.querySelectorAll('tr')].map(r => r.getAttribute('data-drag-id')).filter(Boolean);
  await onReorder(ids);
}

const LOG_PAGE_SIZE = 25;
const logPageState = {}; // key -> huidige paginanummer
function getLogPage(key){ return logPageState[key] || 1; }
function setLogPage(key, page){ logPageState[key] = Math.max(1, page); }
function paginateList(list, key){
  const totalPages = Math.max(1, Math.ceil(list.length / LOG_PAGE_SIZE));
  const page = Math.min(getLogPage(key), totalPages);

// ---------- unieke kleur per persoon (herkenbaar in avatars/tabellen/log) ----------
// Elke geregistreerde gebruiker krijgt een eigen plek (op volgorde van aansluiten),
// en elke plek krijgt een kleurtint die met de gulden hoek gespreid is over het
// kleurenwiel — zo krijgt niemand dezelfde kleur, ook niet bij 25 profielen.
const GOLDEN_ANGLE = 137.508;
function hslToHex(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
  return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
}
function personIndex(name){
  const sorted = [...cache.users].sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
  const idx = sorted.findIndex(u => u.name === name);
  if(idx >= 0) return idx;
  // naam niet (meer) in cache.users (bv. verwijderd profiel in oud logboek) —
  // geef toch een stabiele, ver-weg-liggende kleur zodat botsing onwaarschijnlijk is
  let h = 1000;
  for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return h % 500 + 500;
}
// Handmatige uitzonderingen op de automatische kleurtoewijzing (naam in kleine letters).
const PERSON_COLOR_OVERRIDES = {
  bob: '#2A62AC' // Porsche Shark Blue (benadering — geen officiële hex bestaat)
};
function personColor(name){
  const override = PERSON_COLOR_OVERRIDES[name.trim().toLowerCase()];
  if(override) return override;
  const hue = (personIndex(name) * GOLDEN_ANGLE) % 360;
  return hslToHex(hue, 68, 62);
}
function personDot(name){
  return `<span class="p-dot" style="background:${personColor(name)};"></span>`;
}

function downscaleImage(file, maxSize, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > height){ if(width > maxSize){ height = Math.round(height * maxSize / width); width = maxSize; } }
        else { if(height > maxSize){ width = Math.round(width * maxSize / height); height = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('kon foto niet verwerken')), 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('ongeldige afbeelding'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('kon bestand niet lezen'));
    reader.readAsDataURL(file);
  });
}

async function uploadAvatar(file, userId){
  const blob = await downscaleImage(file, 256, 0.82);
  const path = `${userId}.jpg`;
  const { error: upErr } = await sb.storage.from('avatars').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
  if(upErr) throw upErr;
  const { data } = sb.storage.from('avatars').getPublicUrl(path);
  const url = data.publicUrl + '?v=' + Date.now(); // cache-bust zodat de nieuwe foto meteen zichtbaar is
  const { error } = await sb.rpc('fn_set_avatar', { p_user_id: userId, p_avatar_url: url });
  if(error) throw error;
}

    .on('postgres_changes', {event:'*', schema:'public', table:'loods_log'}, queueRerender)

async function render(overrideHtml){
  const app = document.getElementById('app');
  if(typeof overrideHtml === 'string'){ app.innerHTML = overrideHtml; return; }
  closeMobileMenu(); // elke echte navigatie sluit het mobiele uitklapmenu

  function mount(html, attachFn){
    renderSidebar();
    app.innerHTML = html;
    loadingBarDone();
    if(attachFn) attachFn();
  }

  const mySeq = ++renderSeq;
  loadingBarStart();
  cache.users = await fetchUsers();
  cache.customers = await fetchCustomers();
  clearSessionIfMissing();

  const path = getHash();

  if(path[0] === 'boss'){
    if(!isBossUnlocked()){
      if(mySeq !== renderSeq) return;
      mount(bossLockedView(), attachBossLockedHandlers);
      return;
    }
    const allLog = await fetchAllLoodsLog();
    const allCustLog = await fetchAllCustomerLog();
    const loodsBaseline = await fetchLoodsBaseline();
    if(mySeq !== renderSeq) return;
    mount(bossView(allLog, allCustLog, loodsBaseline), attachBossHandlers);
    return;
  }

  if(!session){
    if(mySeq !== renderSeq) return;
    mount(loginView(), attachLoginHandlers);
    return;
  }

  if(path[0] === 'klanten'){
    if(mySeq !== renderSeq) return;
    mount(klantenListView(), attachKlantenListHandlers);
  } else if(path[0] === 'klant' && path[1]){
    const k = await fetchCustomer(path[1]);
    if(!k){ goTo('/klanten'); return; }
    const klantLog = await fetchCustomerLog(k.id);
    if(mySeq !== renderSeq) return;
    mount(klantDetailView(k, klantLog), () => attachKlantDetailHandlers(k));
  } else {
    cache.log = await fetchLoodsLog();
    const allInlegLog = await fetchAllLoodsLog(); // historiek sinds kalibratiepunt, voor de wachtrij
    const loodsBaseline = await fetchLoodsBaseline();
    if(mySeq !== renderSeq) return;
    mount(dashboardView(allInlegLog, loodsBaseline), attachDashboardHandlers);
  }
}

function dashboardView(allInlegLog, baseline){
  const me = getUser(session);
  const totalIngelegd = cache.users.reduce((s,u)=>s+u.total_ingelegd,0);
  const totalZakjesToegekend = cache.users.reduce((s,u)=>s+zakjesVoor(u),0);
  const totalOpgehaald = cache.users.reduce((s,u)=>s+u.opgehaald,0);
  const myZakjes = zakjesVoor(me);
  const myTegoed = myZakjes - me.opgehaald;

  const queueResult = computeQueueTimeline(buildPostCutoverLog(allInlegLog, cache.users, baseline.ratio_cutover_at), baseline.batch_size, baseline.batch_minutes, baseline.offset_minutes);
  lastQueueResult = queueResult;
  lastLoodsBaseline = baseline;

  const verwerktPerPersoon = verwerkteZakjesPerPersoon(queueResult);
  // wat je écht kan ophalen: enkel het deel dat de wachtrij al effectief
  // verwerkt heeft, niet het volledige instant-toegekende tegoed — anders
  // zou je kunnen "ophalen" wat fysiek nog niet klaar is
  const myMomenteelTegoed = Math.max(0, totaalVerwerktVoorPersoon(me, verwerktPerPersoon) - me.opgehaald);
  const myMomenteelInleg = momenteelInlegVoorPersoon(me, verwerktPerPersoon);
  const myInlegRuimte = Math.max(0, MAX_MOMENTEEL_INLEG - myMomenteelInleg);
  const rows = [...cache.users].sort((a,b)=> (zakjesVoor(b)-b.opgehaald) - (zakjesVoor(a)-a.opgehaald))
    .map(u => {
      const z = zakjesVoor(u);
      const tegoed = z - u.opgehaald;
      const momenteelInleg = momenteelInlegVoorPersoon(u, verwerktPerPersoon);
      const momenteelTegoed = Math.max(0, totaalVerwerktVoorPersoon(u, verwerktPerPersoon) - u.opgehaald);
      return `<tr class="${u.id===me.id?'me':''}">
        <td>${personDot(u.name)}${escapeHtml(u.name)}</td>
        <td class="num">${fmtNum(u.total_ingelegd)}</td>

        <td class="num">${fmtNum(u.opgehaald)}</td>

  const liveTotaalZakjesInLoods = zakjesKlaarInLoods(queueResult, cache.users);

    const u = cache.users.find(x => x.id === e.user_id);
    const persoonlijk = u ? Math.max(0, totaalVerwerktVoorPersoon(u, verwerktPerPersoon) - u.opgehaald) : 0;
    return ` · nu ${fmtNum(liveTotaalZakjesInLoods)} zakjes totaal in loods (${fmtNum(persoonlijk)} van ${u ? escapeHtml(u.name) : escapeHtml(e.user_name)})`;
  };

  const dashLogPage = paginateList(cache.log, 'dashboard');
  const logEntries = dashLogPage.pageItems.map(e => {
    if(e.type === 'inleg'){
      return `<div class="entry inleg">
        <div class="ts">${fmtTs(e.ts)}</div>
        <div class="desc">${personDot(e.user_name)}<b>${escapeHtml(e.user_name)}</b> legde ${e.amount} planten in
          <span class="sub">totaal ${e.cumulative_after} planten · zakjes toegekend: ${e.zakjes_after}${logExtraInfo(e)}</span>
        </div>
        <div class="delta">+${e.zakjes_delta} zakje${e.zakjes_delta===1?'':'s'}</div>
      </div>`;
    }
    if(e.type === 'correctie'){
      return `<div class="entry correctie">
        <div class="ts">${fmtTs(e.ts)}</div>
        <div class="desc">${personDot(e.user_name)}<b>${escapeHtml(e.user_name)}</b> — profiel gecorrigeerd door Boss
          <span class="sub">${escapeHtml(e.note || '')}${logExtraInfo(e)}</span>
        </div>
        <div class="delta">✎</div>
      </div>`;
    }
    return `<div class="entry ophalen">
      <div class="ts">${fmtTs(e.ts)}</div>
      <div class="desc">${personDot(e.user_name)}<b>${escapeHtml(e.user_name)}</b> haalde zakjes op
        <span class="sub">resterend tegoed: ${e.tegoed_after}${logExtraInfo(e)}</span>
      </div>
      <div class="delta">−${e.amount} zakje${e.amount===1?'':'s'}</div>
    </div>`;
  }).join('');

  return `
    ${headerHtml()}
    ${navTabsHtml('loods')}

    <div class="who">
      <div class="name"><button class="who-avatar-btn" data-edit-avatar="1" title="Profielfoto wijzigen">${avatarCircleHtml(me, 26)}</button>${escapeHtml(me.name)}<span><b class="tegoed">${myMomenteelTegoed}</b>&nbsp;zakje${myMomenteelTegoed===1?'':'s'} momenteel tegoed — totaal&nbsp;<b class="tegoed">${myTegoed}</b>&nbsp;zakje${myTegoed===1?'':'s'} tegoed</span></div>
      <button class="btn secondary who-logout" data-logout="1">Uitloggen</button>
    </div>

    <div class="totals" style="margin-bottom:22px;">
      <div class="t"><div class="n" id="stat-planten-loods">${fmtNum(plantenNogInLoods(queueResult, cache.users))}</div><div class="l">planten in loods</div></div>
      <div class="t"><div class="n">${fmtNum(totalZakjesToegekend)}</div><div class="l">zakjes toegekend</div></div>
      <div class="t"><div class="n">${fmtNum(totalOpgehaald)}</div><div class="l">al opgehaald</div></div>
      <div class="t"><div class="n" id="stat-zakjes-in-loods">${fmtNum(zakjesKlaarInLoods(queueResult, cache.users))}</div><div class="l">zakjes in loods</div></div>
      <div class="t"><div class="n tegoed">${fmtNum(totalZakjesToegekend - totalOpgehaald)}</div><div class="l">nog tegoed</div></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${totalZakjesToegekend>0 ? Math.min(100, Math.round(totalOpgehaald/totalZakjesToegekend*100)) : 0}%"></div></div>
      <div class="progress-label"><b>${totalOpgehaald}</b> van <b>${totalZakjesToegekend}</b> toegekende zakjes al opgehaald (${totalZakjesToegekend>0 ? Math.round(totalOpgehaald/totalZakjesToegekend*100) : 0}%)</div>
    </div>

    ${queueWidgetHtml(queueResult, baseline)}

    <div class="grid2">
      <div class="card">
        <h2>${ICONS.sprout}Planten inleggen</h2>
        <p class="hint">Geef door hoeveel planten je in de loods hebt gelegd. Wordt meteen opgeteld bij het totaal (${me.total_ingelegd} nu) en omgerekend: <b>elke ${RATIO_IN} planten leveren ${RATIO_OUT} zakje op, dus ${RATIO_IN}/${RATIO_OUT}</b>.</p>
        <p class="hint">Max <b>${fmtNum(MAX_MOMENTEEL_INLEG)}</b> planten per persoon tegelijk onverwerkt in de loods — jij hebt er nu <b class="mono" style="color:${momenteelInlegKleur(myMomenteelInleg) || 'var(--cream)'}">${fmtNum(myMomenteelInleg)}</b> liggen, dus nog ruimte voor <b class="mono" style="color:var(--lime)">${fmtNum(myInlegRuimte)}</b>. Die ruimte groeit vanzelf weer aan naarmate de wachtrij verwerkt.</p>
        ${momenteelInlegKleur(myMomenteelInleg) ? `<p class="hint" style="color:${momenteelInlegKleur(myMomenteelInleg)};">⚠️ ${myInlegRuimte<=0 ? 'Je zit aan (of over) de limiet — je kan nu niks bijleggen tot er ruimte vrijkomt.' : `Je zit al op ${fmtNum(myMomenteelInleg)}/${fmtNum(MAX_MOMENTEEL_INLEG)} — nog maar weinig ruimte over.`}</p>` : ''}

      ${paginationHtml('dashboard', dashLogPage.page, dashLogPage.totalPages)}
    </div>

      Elke inleg en elke opname wordt hier met naam en tijdstip vastgelegd — dit logboek is voor iedereen zichtbaar,
      zodat achteraf altijd na te gaan is wie wat heeft ingelegd of opgehaald. De code (pin) voorkomt dat iemand
      anders onder jouw naam registreert; het is geen zware beveiliging, maar wel genoeg om vergissingen en
      misverstanden tussen jullie 25 te vermijden.

// ---------- modals ----------
function showModal(html){
  document.getElementById('modal-root').innerHTML = `<div class="modal-bg" id="modal-bg">${html}</div>`;
  document.getElementById('modal-bg').addEventListener('click', (e)=>{ if(e.target.id==='modal-bg') closeModal(); });
}
function closeModal(){
  const root = document.getElementById('modal-root');
  if(root) root.innerHTML = '';
}

function claimModal(user){
  showModal(`<div class="modal">
    <h3>${escapeHtml(user.name)} claimen</h3>
    <p class="hint">Dit profiel is nog niet in gebruik. Stel een code (4 cijfers of meer) in zodat alleen jij hierop kan inloggen.</p>
    <label>Nieuwe code</label>
    <input type="password" inputmode="numeric" id="claim-pin" placeholder="••••" maxlength="8">
    <div class="err" id="claim-err"></div>
    <div class="row-btns">
      <button class="btn secondary" id="claim-cancel" style="flex:1">Annuleren</button>
      <button class="btn" id="claim-ok" style="flex:1">Profiel claimen</button>
    </div>
  </div>`);
  document.getElementById('claim-cancel').onclick = closeModal;
  document.getElementById('claim-ok').onclick = async () => {
    const pin = document.getElementById('claim-pin').value.trim();
    const err = document.getElementById('claim-err');
    if(pin.length < 4){ err.textContent = 'Kies een code van minstens 4 tekens.'; return; }
    const pinHash = await hashPin(pin);
    const { error } = await sb.rpc('fn_claim_profile', { p_user_id: user.id, p_pin_hash: pinHash });
    if(error){ err.textContent = friendlyError(error); return; }
    session = user.id;
    localStorage.setItem(SESSION_KEY, session);
    closeModal();
    goTo('/');
    render();
  };
}

function loginModal(user){
  showModal(`<div class="modal">
    <h3>Inloggen als ${escapeHtml(user.name)}</h3>
    <p class="hint">Voer je code in.</p>
    <label>Code</label>
    <input type="password" inputmode="numeric" id="login-pin" placeholder="••••" maxlength="8">
    <div class="err" id="login-err"></div>
    <div class="row-btns">
      <button class="btn secondary" id="login-cancel" style="flex:1">Annuleren</button>
      <button class="btn" id="login-ok" style="flex:1">Inloggen</button>
    </div>
  </div>`);
  document.getElementById('login-cancel').onclick = closeModal;
  const tryLogin = async () => {
    const pin = document.getElementById('login-pin').value.trim();
    const err = document.getElementById('login-err');
    const pinHash = await hashPin(pin);
    const { data, error } = await sb.rpc('fn_verify_login', { p_user_id: user.id, p_pin_hash: pinHash });
    if(error || !data){ err.textContent = 'Onjuiste code, probeer opnieuw.'; return; }
    session = user.id;
    localStorage.setItem(SESSION_KEY, session);
    closeModal();
    goTo('/');
    render();
  };
  document.getElementById('login-ok').onclick = tryLogin;
  document.getElementById('login-pin').addEventListener('keydown', e => { if(e.key==='Enter') tryLogin(); });
}

function addProfileModal(){
  showModal(`<div class="modal">
    <h3>Nieuw profiel</h3>
    <p class="hint">Er is plaats voor ${MAX_USERS - cache.users.length} extra profiel(en).</p>
    <label>Naam</label>
    <input type="text" id="add-name" maxlength="24" placeholder="bv. tibo">

    <input type="password" inputmode="numeric" id="add-pin" placeholder="••••" maxlength="8">
    <div class="err" id="add-err"></div>
    <div class="row-btns">
      <button class="btn secondary" id="add-cancel" style="flex:1">Annuleren</button>
      <button class="btn" id="add-ok" style="flex:1">Aanmaken</button>
    </div>
  </div>`);
  document.getElementById('add-cancel').onclick = closeModal;
  document.getElementById('add-ok').onclick = async () => {
    const name = document.getElementById('add-name').value.trim();
    const pin = document.getElementById('add-pin').value.trim();
    const err = document.getElementById('add-err');
    if(!name){ err.textContent = 'Geef een naam op.'; return; }
    if(pin.length < 4){ err.textContent = 'Kies een code van minstens 4 tekens.'; return; }
    const pinHash = await hashPin(pin);

    if(error){ err.textContent = friendlyError(error); return; }
    session = data.id;
    localStorage.setItem(SESSION_KEY, session);
    closeModal();
    goTo('/');
    render();
  };
}

    <div style="margin-top:9px;"><button class="btn secondary small" id="pset-pin-save">Code wijzigen</button></div>

    <div class="row-btns">
      <button class="btn" id="pset-close" style="flex:1">Sluiten</button>
    </div>
  </div>`);

  document.getElementById('pset-close').onclick = closeModal;

  document.getElementById('pset-name-save').onclick = async () => {
    const name = document.getElementById('pset-name').value.trim();
    const err = document.getElementById('pset-name-err');
    const btn = document.getElementById('pset-name-save');
    if(!name){ err.textContent = 'Geef een naam op.'; return; }
    btn.disabled = true;
    const { error } = await sb.rpc('fn_update_name', { p_user_id: user.id, p_new_name: name });
    btn.disabled = false;
    if(error){ err.textContent = friendlyError(error); return; }
    err.textContent = '';
    closeModal();
    showToast('Naam bijgewerkt.');
    render();
  };

  document.getElementById('pset-avatar-save').onclick = async () => {
    const fileInput = document.getElementById('pset-avatar-file');
    const err = document.getElementById('pset-avatar-err');
    const file = fileInput.files[0];
    if(!file){ err.textContent = 'Kies eerst een foto.'; return; }
    if(file.size > 8*1024*1024){ err.textContent = 'Bestand is te groot (max 8MB).'; return; }
    const btn = document.getElementById('pset-avatar-save');
    btn.disabled = true; btn.textContent = 'Bezig…';
    try{
      await uploadAvatar(file, user.id);
      closeModal();
      showToast('Profielfoto bijgewerkt.');
      render();
    }catch(e){
      console.error(e);
      err.textContent = 'Upload mislukt. Probeer opnieuw.';
      btn.disabled = false; btn.textContent = 'Foto uploaden';
    }
  };

  document.getElementById('pset-pin-save').onclick = async () => {
    const oldPin = document.getElementById('pset-pin-old').value.trim();
    const newPin = document.getElementById('pset-pin-new').value.trim();
    const err = document.getElementById('pset-pin-err');
    if(newPin.length < 4){ err.textContent = 'Nieuwe code moet minstens 4 tekens zijn.'; return; }
    const btn = document.getElementById('pset-pin-save');
    btn.disabled = true;
    const oldHash = await hashPin(oldPin);
    const newHash = await hashPin(newPin);
    const { data, error } = await sb.rpc('fn_change_pin', { p_user_id: user.id, p_old_pin_hash: oldHash, p_new_pin_hash: newHash });
    btn.disabled = false;
    if(error || !data){ err.textContent = friendlyError(error); return; }
    err.textContent = '';
    document.getElementById('pset-pin-old').value = '';
    document.getElementById('pset-pin-new').value = '';
    showToast('Code gewijzigd.');
  };
}

function bossCodeModal(){

    const pin = document.getElementById('boss-pin').value.trim();
    const err = document.getElementById('boss-err');
    if(!pin){ err.textContent = 'Voer een code in.'; return; }
    const pinHash = await hashPin(pin);

let bossMerged = []; // laatst opgebouwde volledige logboek-lijst
let bossPersonFilter = ''; // blijft staan over renders heen (leeg = iedereen)

function bossLogEntriesHtml(list){
  if(!list.length) return '<div class="empty">Geen registraties.</div>';
  return list.map(e => `
    <div class="entry ${e.cls}">
      <div class="ts">${fmtTs(e.ts)}</div>
      <div class="desc">${personDot(e.person)}<b>${escapeHtml(e.person)}</b> ${e.label}</div>
      <div class="delta">${e.delta}</div>
    </div>
  `).join('');

function bossView(allLog, allCustLog, loodsBaseline){
  // volgorde = cache.users' huidige sortering (sort_order), niet alfabetisch —
  // zo blijft de sleep-volgorde uit "Overzicht per persoon" behouden.
  const persons = cache.users.map(u => u.name);

  const bossQueueResult = computeQueueTimeline(buildPostCutoverLog(allLog, cache.users, loodsBaseline.ratio_cutover_at), loodsBaseline.batch_size, loodsBaseline.batch_minutes, loodsBaseline.offset_minutes);
  lastQueueResult = bossQueueResult; // zodat het registratieformulier hieronder het correcte, actuele momenteel-tegoed kan controleren
  const bossVerwerktPerPersoon = verwerkteZakjesPerPersoon(bossQueueResult);
  const bossLiveTotaalZakjesInLoods = zakjesKlaarInLoods(bossQueueResult, cache.users);
  const bossLogExtraInfo = (userId, userName) => {
    const u = cache.users.find(x => x.id === userId);
    const persoonlijk = u ? Math.max(0, totaalVerwerktVoorPersoon(u, bossVerwerktPerPersoon) - u.opgehaald) : 0;
    return ` · nu ${fmtNum(bossLiveTotaalZakjesInLoods)} zakjes totaal in loods (${fmtNum(persoonlijk)} van ${u ? escapeHtml(u.name) : escapeHtml(userName)})`;
  };

  bossMerged = [
    ...allLog.map(e => ({
      ts: e.ts, person: e.user_name, cls: e.type,
      label: e.type === 'inleg'
        ? `legde ${e.amount} planten in <span class="sub">totaal ${e.cumulative_after} · zakjes toegekend: ${e.zakjes_after}${bossLogExtraInfo(e.user_id, e.user_name)}</span>`
        : e.type === 'correctie'
          ? `profiel gecorrigeerd door Boss <span class="sub">${escapeHtml(e.note || '')}${bossLogExtraInfo(e.user_id, e.user_name)}</span>`
          : `haalde ${e.amount} zakje${e.amount===1?'':'s'} op <span class="sub">resterend tegoed: ${e.tegoed_after}${bossLogExtraInfo(e.user_id, e.user_name)}</span>`,
      delta: e.type === 'inleg' ? `+${e.zakjes_delta} zakje${e.zakjes_delta===1?'':'s'}` : e.type === 'correctie' ? '✎' : `−${e.amount} zakje${e.amount===1?'':'s'}`
    })),
    ...allCustLog.map(e => {
      const klant = getKlant(e.customer_id);
      return {
        ts: e.ts, person: e.by_user_name, cls: 'levering',
        label: `leverde ${e.amount} aan <b>${escapeHtml(klant ? klant.name : 'verwijderde klant')}</b> <span class="sub">totaal klant ${e.cumulative_after} · +${e.zakjes_delta} zakje${e.zakjes_delta===1?'':'s'} meegekregen</span>`,
        delta: `+${e.zakjes_delta} zakje${e.zakjes_delta===1?'':'s'}`
      };
    })
  ].sort((a,b) => new Date(b.ts) - new Date(a.ts));
  const summary = persons.map(name => {
    const u = cache.users.find(x => x.name === name);
    const geleverd = allCustLog.filter(e => e.by_user_name === name).reduce((s,e)=>s+e.amount, 0);
    const zakjes = u ? zakjesVoor(u) : 0;
    return {
      id: u ? u.id : null,
      name,
      ingelegd: u ? u.total_ingelegd : 0,
      momenteelInleg: u ? momenteelInlegVoorPersoon(u, bossVerwerktPerPersoon) : 0,
      zakjes,
      opgehaald: u ? u.opgehaald : 0,
      momenteelTegoed: u ? Math.max(0, totaalVerwerktVoorPersoon(u, bossVerwerktPerPersoon) - u.opgehaald) : 0,
      tegoed: u ? zakjes - u.opgehaald : 0,
      geleverd,
      discordId: u ? u.discord_id : null,
      legacyZakjes: u ? (u.legacy_zakjes || 0) : 0
    };
  });

  return `
    ${headerHtml()}
    <div class="who">
      <div class="name">Boss menu<span>volledig overzicht van alle ${persons.length} profielen</span></div>
      <button class="btn secondary" data-boss-lock="1">${ICONS.lock}Vergrendelen</button>
    </div>

    <div class="section-title"><h2>${ICONS.users}Overzicht per persoon</h2><span>${persons.length} leden — sleep om volgorde aan te passen</span></div>
    <div class="card" style="padding:14px 20px;">
      <table>
        <thead><tr><th></th><th>Naam</th><th class="num">Ingelegd</th><th class="num">Momenteel inleg</th><th class="num">Totale zakjes</th><th class="num">Opgehaald</th><th class="num">Momenteel tegoed</th><th class="num">Tegoed</th><th class="num">Geleverd aan klanten</th><th>Discord</th><th></th></tr></thead>
        <tbody id="boss-summary-tbody">${summary.map(s => `<tr data-drag-id="${s.id || ''}">
          <td style="width:1%;">${s.id ? `<span class="drag-handle" data-drag-handle="1" title="Sleep om te herschikken">${ICONS.grip}</span>` : ''}</td>
          <td>${personDot(s.name)}${escapeHtml(s.name)}</td>
          <td class="num">${fmtNum(s.ingelegd)}</td>
          <td class="num" style="${momenteelInlegKleur(s.momenteelInleg) ? `color:${momenteelInlegKleur(s.momenteelInleg)};font-weight:700;` : ''}">${fmtNum(s.momenteelInleg)}${momenteelInlegKleur(s.momenteelInleg) ? ' ⚠️' : ''}</td>
          <td class="num">${fmtNum(s.zakjes)}</td>
          <td class="num">${fmtNum(s.opgehaald)}</td>
          <td class="num">${fmtNum(s.momenteelTegoed)}</td>
          <td class="num tegoed">${fmtNum(s.tegoed)}</td>
          <td class="num">${fmtNum(s.geleverd)}</td>
          <td style="white-space:nowrap;">${s.id ? `
            ${s.discordId ? `<span class="mono" style="font-size:12px;color:var(--muted);margin-right:6px;">${escapeHtml(s.discordId)}</span>` : ''}
            <button class="btn secondary small" data-edit-discord="${s.id}" data-discord-name="${escapeHtml(s.name)}" data-discord-current="${escapeHtml(s.discordId || '')}">${ICONS.gear}${s.discordId ? 'Wijzig' : 'Koppelen'}</button>
          ` : ''}</td>
          <td style="text-align:right;white-space:nowrap;">${s.id ? `
            <button class="btn secondary small" data-edit-userdata="${s.id}" data-edit-name="${escapeHtml(s.name)}" data-edit-ingelegd="${s.ingelegd}" data-edit-opgehaald="${s.opgehaald}" data-edit-legacy="${s.legacyZakjes}" style="margin-right:6px;">${ICONS.gear}Bewerken</button>
            <button class="btn secondary small" data-reset-pin="${s.id}" data-reset-name="${escapeHtml(s.name)}" style="margin-right:6px;">${ICONS.lock}Code resetten</button>
            <button class="btn danger small" data-del-profile="${s.id}" data-del-name="${escapeHtml(s.name)}">${ICONS.trash}Verwijderen</button>
          ` : ''}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>

    <div class="section-title"><h2>${ICONS.clock}Wachtrij kalibreren</h2><span>enkel hier zichtbaar</span></div>
    <div class="card" style="margin-bottom:20px;">
      <p class="hint">Vul in hoeveel er <b>op dit moment écht</b> in de loods ligt. De site berekent dan zelf hoeveel de klok van de hele wachtrij moet verschuiven zodat alle tijden (van iedereen) opnieuw kloppen — geen gaten of sprongen, alles schuift in dezelfde verhouding mee.</p>
      <p class="hint">Huidige verschuiving: <b class="mono" style="color:var(--cream)">${loodsBaseline.offset_minutes >= 0 ? '+' : ''}${loodsBaseline.offset_minutes} min</b>, snelheid <b class="mono" style="color:var(--cream)">${loodsBaseline.batch_size}/${loodsBaseline.batch_minutes}min</b>${loodsBaseline.set_by ? ` — gezet door ${escapeHtml(loodsBaseline.set_by)} om ${fmtClock(new Date(loodsBaseline.set_at))}` : ' — nog niet ingesteld'}.</p>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
        <div>
          <label for="loods-baseline-value">Werkelijke voorraad nu</label>
          <input type="number" id="loods-baseline-value" min="0" placeholder="bv. 13385" style="max-width:150px;">
        </div>
        <div>
          <label for="loods-baseline-batch-size">Zakjes / batch</label>
          <input type="number" id="loods-baseline-batch-size" min="1" value="${loodsBaseline.batch_size}" style="max-width:90px;">
        </div>
        <div>
          <label for="loods-baseline-batch-minutes">Minuten / batch</label>
          <input type="number" id="loods-baseline-batch-minutes" min="1" value="${loodsBaseline.batch_minutes}" style="max-width:90px;">
        </div>
        <button class="btn boss small" id="loods-baseline-save" style="margin-bottom:1px;">Kalibreren</button>
      </div>
      <div class="err" id="loods-baseline-err"></div>
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line);">
        ${loodsBaseline.paused
          ? `<p class="hint">⏸ Gepauzeerd sinds <b>${fmtClock(new Date(loodsBaseline.paused_at))}</b> op ${fmtDate(new Date(loodsBaseline.paused_at))} — niemand kan nu inleggen/ophalen, de wachtrij-klok staat stil.</p>
             <button class="btn boss small" id="loods-pause-toggle">Hervatten</button>`
          : `<p class="hint">Pauzeert de hele wachtrij-klok én blokkeert inleg/ophalen voor iedereen — handig tijdens onderhoud (bv. een ratio-wijziging).</p>
             <button class="btn boss small" id="loods-pause-toggle">Pauzeren</button>`}
        <div class="err" id="loods-pause-err"></div>
      </div>
    </div>

    <div class="section-title"><h2>${ICONS.sprout}Inleg/ophalen registreren voor een profiel</h2><span>enkel via Boss menu — kies eerst een profiel</span></div>
    <div class="card" style="margin-bottom:20px;">
      <label for="boss-reg-person">Profiel</label>
      <select id="boss-reg-person" class="select-field" style="margin-bottom:16px;">
        ${cache.users.map(u => `<option value="${u.id}">${escapeHtml(u.name)}</option>`).join('')}
      </select>
      <div class="grid2">

      <label for="boss-filter">Filter op persoon</label>

    <div class="card" style="padding:6px 20px;margin-top:16px;">

async function deleteProfileFromBoss(userId, userName){
  if(!confirm(`Profiel van "${userName}" verwijderen? Het logboek blijft bewaard (met naam), enkel het inlogprofiel verdwijnt. Dit kan niet ongedaan gemaakt worden.`)) return;
  const { error } = await sb.rpc('fn_delete_profile', { p_user_id: userId, p_boss_pin_hash: bossPinHash() });
  if(error){ showToast(friendlyError(error), 'error'); return; }
  showToast(`Profiel "${userName}" verwijderd.`);
  render();
}

async function deleteKlantFromBoss(customerId, customerName){
  if(!confirm(`Klant "${customerName}" verwijderen? De leverings-/verkoopgeschiedenis blijft bewaard (als "verwijderde klant"), enkel de klantfiche zelf verdwijnt. Dit kan niet ongedaan gemaakt worden.`)) return;

// bepaalt hoeveel minuten de volledige gesimuleerde klok moet verschuiven
// zodat het model exact "realValue" planten nog te verwerken toont NU —
// diezelfde verschuiving wordt daarna op ALLE batches (van iedereen)
// toegepast, dus alles blijft in de juiste relatieve volgorde staan.
function computeCalibrationOffset(log, batchSize, batchMinutes, totalIngelegd, realValue){
  const pure = computeQueueTimeline(log, batchSize, batchMinutes, 0); // ongekalibreerd referentiemodel
  const realVerwerkteZakjes = Math.round((totalIngelegd - realValue) / RATIO_IN);
  if(realVerwerkteZakjes <= 0) return 0;
  const sorted = [...pure.batches].sort((a,b) => a.end - b.end);
  let cumulative = 0, refTime = null;
  for(const b of sorted){
    cumulative += b.zakjes;
    if(cumulative >= realVerwerkteZakjes){ refTime = b.end; break; }
  }
  if(!refTime) return 0; // opgegeven waarde impliceert meer verwerkt dan er ooit zakjes waren — negeer
  return Math.round((Date.now() - refTime.getTime()) / 60000);
}

async function saveLoodsBaseline(){
  const err = document.getElementById('loods-baseline-err');
  const val = parseInt(document.getElementById('loods-baseline-value').value, 10);
  const bs = parseInt(document.getElementById('loods-baseline-batch-size').value, 10);
  const bm = parseInt(document.getElementById('loods-baseline-batch-minutes').value, 10);
  if(isNaN(val) || val < 0){ err.textContent = 'Voer een geldig voorraadaantal in.'; return; }
  if(isNaN(bs) || bs <= 0 || isNaN(bm) || bm <= 0){ err.textContent = 'Voer een geldige snelheid in.'; return; }
  const btn = document.getElementById('loods-baseline-save');
  btn.disabled = true; btn.textContent = 'Bezig…';
  try{
    const freshLog = await fetchAllLoodsLog();
    const totalIngelegd = cache.users.reduce((s,u) => s + u.total_ingelegd, 0);
    const offsetMinutes = computeCalibrationOffset(freshLog, bs, bm, totalIngelegd, val);
    const me = getUser(session);
    const { error } = await sb.rpc('fn_set_loods_baseline', {
      p_offset_minutes: offsetMinutes, p_batch_size: bs, p_batch_minutes: bm,
      p_boss_pin_hash: bossPinHash(), p_set_by: me ? me.name : 'boss'
    });
    if(error){ err.textContent = friendlyError(error); btn.disabled = false; btn.textContent = 'Kalibreren'; return; }
    err.textContent = '';
    showToast('Wachtrij gekalibreerd — alle tijden herberekend.');
    render();
  }catch(e){
    console.error(e);
    err.textContent = 'Er ging iets mis bij het kalibreren.';
    btn.disabled = false; btn.textContent = 'Kalibreren';
  }
}

// ---------- event wiring: loods dashboard ----------
function attachDashboardHandlers(){
  attachCommonHandlers();
  attachQueueWidgetHandlers();
  startQueueTicker();

  const paused = lastLoodsBaseline && lastLoodsBaseline.paused;

  const inAmount = document.getElementById('in-amount');
  if(inAmount){
    const preview = document.getElementById('in-preview');
    if(paused){
      inAmount.disabled = true;
      document.getElementById('in-submit').disabled = true;
      preview.innerHTML = '<span class="err">De loods is tijdelijk gepauzeerd voor onderhoud — even geduld.</span>';
    }
    inAmount.addEventListener('input', () => {
      const v = parseInt(inAmount.value, 10);
      if(!v || v <= 0){ preview.innerHTML=''; return; }
      const me = getUser(session);
      const momenteelInleg = momenteelInlegVoorPersoon(me, verwerkteZakjesPerPersoon(lastQueueResult));
      const ruimte = Math.max(0, MAX_MOMENTEEL_INLEG - momenteelInleg);
      if(v > ruimte){
        preview.innerHTML = `<span class="err">Kan niet — max ${fmtNum(MAX_MOMENTEEL_INLEG)} planten tegelijk onverwerkt per persoon. Je hebt nog ruimte voor <b>${fmtNum(ruimte)}</b>.</span>`;
        return;
      }
      const newTotal = me.total_ingelegd + v;
      const newZakjes = zakjesForTotal(me.legacy_zakjes || 0, newTotal);
      const delta = newZakjes - zakjesVoor(me);
      preview.innerHTML = `Nieuw totaal: <b>${newTotal}</b> planten → jij krijgt er <b>+${delta}</b> zakje${delta===1?'':'s'} bij.`;
    });
    document.getElementById('in-submit').addEventListener('click', async () => {
      const v = parseInt(inAmount.value, 10);
      const err = document.getElementById('in-err');
      if(!v || v <= 0){ err.textContent = 'Voer een geldig aantal planten in.'; return; }
      const me = getUser(session);
      const momenteelInleg = momenteelInlegVoorPersoon(me, verwerkteZakjesPerPersoon(lastQueueResult));
      const { error } = await sb.rpc('fn_register_inleg', { p_user_id: session, p_amount: v, p_huidig_momenteel_inleg: momenteelInleg });
      if(error){ err.textContent = friendlyError(error); return; }
      showToast(`Inleg geregistreerd: +${v} planten.`);
      render();
    });
  }

  const outAmount = document.getElementById('out-amount');
  if(outAmount){
    const outPreview = document.getElementById('out-preview');
    if(paused){
      outAmount.disabled = true;
      document.getElementById('out-submit').disabled = true;
      document.getElementById('out-err').innerHTML = '<span>De loods is tijdelijk gepauzeerd voor onderhoud — even geduld.</span>';
    }
    outAmount.addEventListener('input', () => {
      const v = parseInt(outAmount.value, 10);
      if(!v || v <= 0){ outPreview.innerHTML=''; return; }
      const me = getUser(session);
      const maxTegoed = Math.max(0, totaalVerwerktVoorPersoon(me, verwerkteZakjesPerPersoon(lastQueueResult)) - me.opgehaald);
      if(v > maxTegoed){
        outPreview.innerHTML = `<span class="err">Kan niet — je hebt momenteel maar <b>${fmtNum(maxTegoed)}</b> zakje${maxTegoed===1?'':'s'} echt verwerkt liggen (de rest is nog in verwerking).</span>`;
        return;
      }
      outPreview.innerHTML = '';
    });
    document.getElementById('out-submit').addEventListener('click', async () => {
      const v = parseInt(outAmount.value, 10);
      const err = document.getElementById('out-err');
      if(!v || v <= 0){ err.textContent = 'Voer een geldig aantal zakjes in.'; return; }
      const me = getUser(session);
      const maxTegoed = Math.max(0, totaalVerwerktVoorPersoon(me, verwerkteZakjesPerPersoon(lastQueueResult)) - me.opgehaald);
      const { error } = await sb.rpc('fn_register_ophalen', { p_user_id: session, p_amount: v, p_max_tegoed: maxTegoed });
      if(error){ err.textContent = friendlyError(error); return; }
      showToast(`Opgehaald: ${v} zakje${v===1?'':'s'}.`);
      render();
    });
  }
}

async function toggleMaintenance(){
  const err = document.getElementById('loods-pause-err');
  const btn = document.getElementById('loods-pause-toggle');
  const wantPause = !lastLoodsBaseline.paused;
  if(wantPause && !confirm('Wachtrij pauzeren? Niemand kan dan nog inleggen of ophalen tot je opnieuw hervat.')) return;
  btn.disabled = true; btn.textContent = 'Bezig…';
  const { error } = await sb.rpc('fn_set_maintenance', { p_paused: wantPause, p_boss_pin_hash: bossPinHash() });
  if(error){ err.textContent = friendlyError(error); btn.disabled = false; btn.textContent = wantPause ? 'Pauzeren' : 'Hervatten'; return; }
  showToast(wantPause ? 'Wachtrij gepauzeerd.' : 'Wachtrij hervat.');
  render();
}
